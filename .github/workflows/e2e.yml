name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/simulator
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        # No E2E_* stress env vars are set here on purpose: the stress tests
        # (Phases 8 / 9 / 10 / 11) fall back to their CI-minimal defaults so the
        # whole suite stays a fast per-PR gate. Raise the env vars locally or in
        # a nightly job for the canonical long soak — see docs/e2e.md
        # ("Stress tests on CI").
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/simulator/e2e/.report
          retention-days: 14

      - name: Upload performance metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-metrics
          path: apps/simulator/e2e/.results
          retention-days: 30
