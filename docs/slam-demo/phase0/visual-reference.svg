<path d="M40 929H1400" stroke="#354852"/><text x="40" y="963" class="label">Design gate</text><text x="40" y="995" class="muted">Readable at robot eye level. Texture variation supports tracking. Cosmetic bloom stays out of sensor pixels.</text><text x="40" y="1027" class="muted tiny">This sheet specifies Phase 2 art direction; the Phase 0 browser probe is a separate numerical/material test scene.</text>
