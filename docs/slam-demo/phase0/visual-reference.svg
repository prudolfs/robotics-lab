<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
<title id="title">Robotics Lab — SLAM visual specification</title><desc id="desc">Viewport layout, compact rover silhouette, lab route, material palette and scientific overlay legend. Design specification rather than a finished render.</desc>
<defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#2b3a41" stroke-width=".7"/></pattern><linearGradient id="paint" x2="1" y2="1"><stop stop-color="#448e92"/><stop offset="1" stop-color="#163d46"/></linearGradient><linearGradient id="metal"><stop stop-color="#647982"/><stop offset=".45" stop-color="#d4dfe0"/><stop offset="1" stop-color="#637883"/></linearGradient><style>text{font-family:Arial,sans-serif;fill:#dce7e9}.muted{fill:#92abb5}.tiny{font-size:13px}.label{font-size:17px;font-weight:bold}.section{font-size:12px;letter-spacing:2px;fill:#7edbc7}</style></defs>
<rect width="1440" height="1060" fill="#101a20"/>
<text x="40" y="40" class="section">ROBOTICS LAB / VISUAL SLAM / PHASE 0</text><text x="40" y="80" font-size="30" font-weight="bold">An inspection lab you can understand through a robot’s eyes.</text><text x="40" y="111" class="muted">Industrial materials · warm task lighting · cool ambient fill · precise, quiet overlays</text>
<rect x="40" y="145" width="1360" height="480" rx="12" fill="#19262e" stroke="#354852"/>
